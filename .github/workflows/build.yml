name: Build FluidHUD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluidhud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: .\build.ps1 -Platform "${{ matrix.platform }}"

      - name: Prepare artifact
        shell: pwsh
        run: |
          $target = "release\FluidHUD-${{ matrix.rid }}.exe"
          Copy-Item "release\FluidHUD.exe" $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $target -Leaf)" | Set-Content "$target.sha256" -Encoding ascii

      - name: Smoke test x64
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $process = Start-Process "release\FluidHUD-win-x64.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "FluidHUD exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidHUD-${{ matrix.rid }}
          path: |
            release/FluidHUD-${{ matrix.rid }}.exe
            release/FluidHUD-${{ matrix.rid }}.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FluidHUD-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.sha256
