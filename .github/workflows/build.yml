name: Build FluidHUD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluidhud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            machine: "0x8664"
          - platform: ARM64
            rid: win-arm64
            machine: "0xAA64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.408

      - name: Publish
        shell: pwsh
        run: .\build.ps1 -Platform "${{ matrix.platform }}"

      - name: Validate executable
        shell: pwsh
        run: |
          $target = "release\FluidHUD.exe"
          $bytes = [System.IO.File]::ReadAllBytes($target)
          if ($bytes.Length -lt 10MB) {
            throw "Published executable is unexpectedly small."
          }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "DOS signature is invalid."
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) {
            throw "PE signature is invalid."
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = [Convert]::ToUInt16("${{ matrix.machine }}".Substring(2), 16)
          if ($machine -ne $expected) {
            throw "PE machine mismatch: expected $expected, got $machine."
          }
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FluidHUD.exe" | Set-Content "release\FluidHUD.exe.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidHUD-${{ matrix.rid }}
          path: |
            release/FluidHUD.exe
            release/FluidHUD.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FluidHUD-*
          path: release-assets

      - name: Package release assets
        shell: bash
        run: |
          cd release-assets/FluidHUD-win-x64
          zip -9 ../../FluidHUD-win-x64.zip FluidHUD.exe FluidHUD.exe.sha256
          cd ../FluidHUD-win-arm64
          zip -9 ../../FluidHUD-win-arm64.zip FluidHUD.exe FluidHUD.exe.sha256
          cd ../..
          sha256sum FluidHUD-win-x64.zip > FluidHUD-win-x64.zip.sha256
          sha256sum FluidHUD-win-arm64.zip > FluidHUD-win-arm64.zip.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            FluidHUD-win-x64.zip
            FluidHUD-win-x64.zip.sha256
            FluidHUD-win-arm64.zip
            FluidHUD-win-arm64.zip.sha256
